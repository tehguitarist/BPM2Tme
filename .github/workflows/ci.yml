# Build gate for BPM2Time: on every push to main and every PR, build the plugin on all three
# platforms and validate the macOS AU with auval so a broken build/AU never lands on main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (macOS: AU + VST3)
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --target BPM2Time_AU --target BPM2Time_VST3 --parallel

      - name: Build (Windows/Linux: VST3)
        if: runner.os != 'macOS'
        run: cmake --build build --config Release --target BPM2Time_VST3 --parallel

      - name: Validate AU (auval)
        if: runner.os == 'macOS'
        run: |
          # On a clean CI runner the freshly-copied .component isn't registered with the
          # AudioComponentRegistrar yet, so auval reports "didn't find the component" / -50.
          # Bounce the registrar so it rescans ~/Library/Audio/Plug-Ins/Components and retry.
          ls -la "$HOME/Library/Audio/Plug-Ins/Components/" || true
          ok=0
          for i in 1 2 3 4; do
            if auval -v aufx I7r3 Manu; then ok=1; break; fi
            echo "::warning::auval attempt $i failed; bouncing AudioComponentRegistrar and retrying"
            killall -9 AudioComponentRegistrar 2>/dev/null || true
            sleep 5
          done
          [ "$ok" = 1 ]

      - name: Validate VST3 (pluginval)
        run: |
          VERSION=1.0.4
          case "${{ runner.os }}" in
            macOS)   URL="https://github.com/Tracktion/pluginval/releases/download/v${VERSION}/pluginval_macOS.zip" ;;
            Windows) URL="https://github.com/Tracktion/pluginval/releases/download/v${VERSION}/pluginval_Windows.zip" ;;
            Linux)   URL="https://github.com/Tracktion/pluginval/releases/download/v${VERSION}/pluginval_Linux.zip" ;;
          esac
          curl -L -o pluginval.zip "$URL"
          case "${{ runner.os }}" in
            macOS)   unzip -q pluginval.zip && PLUGINVAL="./pluginval.app/Contents/MacOS/pluginval" ;;
            Windows) unzip -q pluginval.zip && PLUGINVAL="./pluginval.exe" ;;
            Linux)   unzip -q pluginval.zip && PLUGINVAL="./pluginval" ;;
          esac
          chmod +x "$PLUGINVAL" 2>/dev/null || true
          "$PLUGINVAL" --strictness-level 5 --validate build/BPM2Time_artefacts/Release/VST3/BPM2Time.vst3
        shell: bash
